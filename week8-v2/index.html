<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>아름다움의 기준 — 세 사람의 인터뷰 · 서승오</title>
<meta name="description" content="Phi Design School Aesthetic Literacy, 서승오 — 세 직군에게 물은 아름다움의 기준과 그 장소, 그리고 나의 취향." />
<link rel="stylesheet" href="./vendor/maplibre-gl.css" />
<style>
@font-face{font-family:"Pretendard";src:url("./fonts/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --ink:#0d0d0d; --blue:#4b77fc; --gray:#bebebe; --line:#eee;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  --col:min(100vw,480px);
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all}
body{overscroll-behavior:none}

/* ---------- 고정 무대: 스크롤 동안 화면에 붙어 있는 층들 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#fff}
.layer{position:absolute;inset:0;pointer-events:none}
#bgIntro{background:linear-gradient(#d3ebff 0%,#cde8ff 42%,#02213e 100%)}
#bgNight{background:linear-gradient(#000b16,#385d84);opacity:0}
#stars{opacity:0}
#map{position:absolute;inset:0;opacity:0}
#map .maplibregl-ctrl-attrib{background:#ffffffb3;color:#8d8d8d;font-size:9px}
#map .maplibregl-ctrl-attrib a{color:#8d8d8d}
#map .maplibregl-ctrl{transition:opacity .4s}
#stage.nomap #map .maplibregl-ctrl{opacity:0;pointer-events:none}
#mapFade{height:46%;background:linear-gradient(#fff,#fff 62%,#fff0);opacity:0}

/* 하늘(공통점) — 밤 → 노을, 아래로 내려가며 바뀐다 */
#sky{opacity:0;overflow:hidden}
#skyStrip{position:absolute;left:0;right:0;top:0;height:300%;
  background:linear-gradient(#071a33 0%,#0f2c52 18%,#2b4c78 36%,#56709a 50%,#9a8ea6 62%,#e0a07e 76%,#f4a35a 88%,#f8b36a 100%)}
#skyClouds{position:absolute;inset:auto -10% 0 -10%;height:55%;opacity:0;
  background:radial-gradient(60% 40% at 30% 70%,#f6b98a99,#0000 70%),radial-gradient(50% 30% at 75% 55%,#f3a26a88,#0000 70%),radial-gradient(70% 25% at 50% 92%,#ffd29a99,#0000 70%);filter:blur(10px)}

/* 인트로 카드 → 원 → 지구본 */
#card{position:absolute;background:#fff;border-radius:24px;overflow:hidden;will-change:left,top,width,height,border-radius}
#cardInner{position:absolute;left:0;top:0;width:358px;height:812px;padding:32px 28px;display:flex;flex-direction:column;gap:10px;transform-origin:0 0}
#cardInner img{width:302px;height:446px;object-fit:contain;display:block}
.intro-copy{margin-top:42px;display:flex;flex-direction:column;gap:10px}
.intro-copy h1{margin:0;font-size:30px;line-height:1.4;font-weight:700;color:#000;letter-spacing:-.01em}
.intro-copy p{margin:0;font-size:16px;line-height:1.6;color:#000;white-space:pre-line}

/* 화면 위 글 */
.col{position:absolute;left:50%;transform:translateX(-50%);width:var(--col);padding:0 24px}
#qGlobe{top:max(40px,env(safe-area-inset-top));margin:0;text-align:center;color:#fff;font-size:30px;line-height:1.4;font-weight:700;opacity:0}
#hint{bottom:max(28px,env(safe-area-inset-bottom));margin:0;text-align:center;color:#fff;font-size:14px;line-height:20px;font-weight:500;opacity:0}

#copy{top:max(40px,env(safe-area-inset-top))}
#copy .role{font-size:15px;line-height:22px;font-weight:700;color:var(--ink)}
#copy .key{margin:0;padding:12px 0 10px;font-size:30px;line-height:1.4;font-weight:700;color:#000;letter-spacing:-.01em}
#copy .answer{margin-top:12px}
#copy .answer p{margin:0;font-size:16px;line-height:1.6;color:#000}
#copy>*{opacity:0;transform:translateY(14px)}
#copy.in>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
#copy.in>:nth-child(2){animation-delay:.08s}
#copy.in>:nth-child(3){animation-delay:.18s}

/* 장소 카드 + 핀 */
#place{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px}
#place .card{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 16px 12px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 4px 14px #00000014;opacity:0;transform:translateY(18px) scale(.94);transform-origin:50% 100%}
#place .photo{width:var(--photo,240px);height:var(--photo,240px);border-radius:21px;overflow:hidden;background:#eee}
#place .photo img{width:100%;height:100%;object-fit:cover;display:block}
#place .label{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
#place b{font-size:18px;line-height:20px;font-weight:700;color:var(--ink)}
#place small{font-size:12px;line-height:1.6;color:#000}
.marker{position:relative;width:18px;height:18px;opacity:0}
.marker i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--blue)}
.marker b{position:absolute;inset:4px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #fff,0 2px 8px #00000040}
#place.on .marker{opacity:1;animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
#place.on .marker i{animation:pulse 1.8s ease-out .3s infinite}
#place.on .card{animation:pop .6s cubic-bezier(.2,.8,.2,1.15) .25s forwards}

/* 진행 점 */
#dots{position:absolute;right:11px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .4s}
#dots span{width:6px;height:6px;border-radius:3px;background:var(--gray);transition:height .4s,background .4s}
#dots span.on{height:16px;background:var(--blue)}
#stage.dark #dots span.on{background:#fff}

/* 공통점 — 가운데에 뜨는 글 */
#common{top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff}
#common h2{margin:0 0 16px;font-size:30px;line-height:1.4;font-weight:700}
#common p{margin:0;font-size:17px;line-height:1.75}
.w{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(8px);white-space:pre}

/* ---------- 스크롤 트랙 (높이만 담당) ---------- */
#track{position:relative;height:var(--trackH,820vh);pointer-events:none}

/* ---------- 취향과 아름다움 — 검정으로 덮으며 올라온다 ---------- */
#taste{position:relative;z-index:2;background:#000;color:#fff;padding:80px 24px 72px;display:flex;flex-direction:column;align-items:center}
#taste .inner{width:min(100%,432px);display:flex;flex-direction:column;gap:32px}
#taste h2{margin:0;font-size:30px;line-height:1.4;font-weight:700}
#taste .collage{width:100%;aspect-ratio:342/343;border-radius:16px;overflow:hidden;background:#111}
#taste .collage img{width:100%;height:100%;object-fit:cover;display:block}
#taste h3{margin:0 0 8px;font-size:24px;line-height:1.5;font-weight:700;letter-spacing:-.046em}
#taste p{margin:0;font-size:16px;line-height:1.6}
#taste .more{align-self:center;margin-top:20px;display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 24px;border-radius:47px;background:#fff;color:#000;border:1px solid #0000000f;font-size:16px;font-weight:700;letter-spacing:-.07em;text-decoration:none}
#taste .reveal{opacity:0;transform:translateY(24px)}

@keyframes rise{to{opacity:1;transform:none}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes drop{0%{transform:translateY(-24px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  #copy.in>*,#place.on .card,#place.on .marker{animation-duration:.01s!important}
  #place.on .marker i{animation:none}
}
</style>
</head>
<body>

<div id="stage">
  <div class="layer" id="bgIntro"></div>
  <div class="layer" id="bgNight"></div>
  <canvas class="layer" id="stars"></canvas>
  <div id="map"></div>
  <div class="layer" id="mapFade"></div>
  <div class="layer" id="sky"><div id="skyStrip"></div><div id="skyClouds"></div></div>

  <div id="card"><div id="cardInner">
    <img src="./img/intro-statue.png" alt="종이 카드를 벽에 붙이는 여신상 일러스트" />
    <div class="intro-copy">
      <h1>아름다움을 보는<br>미감은 타고나는 걸까?</h1>
      <p>아름다움을 알아보는 능력은 후천적으로 학습할수 있는 걸까요?

아름다움의 본질을 알아보기 위해 파티시에, 음악 엔지니어, 필름메이커 등 여러 직종의 사람들과 인터뷰를 진행 해봤습니다.</p>
    </div>
  </div></div>

  <h2 class="col" id="qGlobe">‘아름다움'의 기준이 무엇인가요? 아름다운 장소도 말씀해 주세요.</h2>
  <p class="col" id="hint">스크롤해서 넘기기</p>

  <section class="col" id="copy" aria-live="polite"></section>
  <div id="place" aria-hidden="true">
    <div class="card"><div class="photo"><img alt="" /></div><div class="label"><b></b><small></small></div></div>
    <div class="marker"><i></i><b></b></div>
  </div>

  <div class="col" id="common">
    <h2></h2>
    <p></p>
  </div>

  <nav id="dots" aria-label="진행"></nav>
</div>

<div id="track"></div>

<section id="taste">
  <div class="inner">
    <h2 class="reveal">취향과 아름다움.</h2>
    <div class="collage reveal"><img src="./img/taste-collage.jpg" alt="좋아하는 이미지들을 모은 콜라주" loading="lazy" /></div>
    <div class="reveal">
      <h3>취향</h3>
      <p>전체적인 형태와 구성은 정돈되어 있지만 그 안의 한 가지 요소가 예상과 다르게 어긋나 있어, 한 번에 설명되지 않고 만든 사람의 의도와 생각을 따라가게 만드는 것에 끌린다.</p>
    </div>
    <a class="more reveal" href="#" id="moreBtn">취향 더보기</a>
  </div>
</section>

<script src="./vendor/maplibre-gl.js"></script>
<script src="./vendor/gsap.min.js"></script>
<script src="./vendor/ScrollTrigger.min.js"></script>
<script>
(function(){
"use strict";
gsap.registerPlugin(ScrollTrigger);

/* ================= 데이터 ================= */
var PEOPLE = [
  { role:"파티시에 (Pâtissier)", key:"제가 생각하는 아름다움은<br>'욕망의 동의어'",
    answer:["아름다움은 근본적으로 각자의 관점에서 느끼는 매력이라고 생각하거든요. 사람마다 다를 수 있지만, 그 본질은 결국 '내 관점에서 매력적이다 즉 ‘갖고싶다'라는 거죠."],
    place:"밍글스 Mingles (과거 직장)", region:"서울 강남구 청담동", img:"./img/place-mingles.jpg",
    lnglat:[127.0446,37.5246], zoom:15.4 },
  { role:"필름메이커", key:"계속 바라보게 되고,<br>시선이 이끌리는 것.",
    answer:["마음이 두근거리고 호기심이 생기는 것. 다양한 형태의 자연.","아름답지 않은 것은 불쾌하고 역겨운 감정과 함께 시선을 피하게 되는 것이고, 불안을 야기하는 것들요."],
    place:"National taichung", region:"대만 타이중국립극장", img:"./img/place-taichung.jpg",
    lnglat:[120.6402,24.163], zoom:15.6 },
  { role:"음악 엔지니어", key:"규칙과 무규칙<br>사이의 줄타기",
    answer:["내가 생각하는 아름다움에는 또렷한 규칙이나 기준이 없습니다. 완벽하지 않기에 더욱 아름답고, 예상할 수 없기에 더욱 감탄하게 되기 때문에요.","다만 내게 아름다움은 완전한 카오스 상태를 의미하지는 않습니다. 규칙과 무규칙 사이의 줄타기가 규칙을 더욱 특별하게, 무규칙을 더욱 특별하게 만들죠."],
    place:"감천 문화마을", region:"부산 사하구", img:"./img/place-gamcheon.jpg",
    lnglat:[129.0106,35.0975], zoom:15.6 }
];
var COMMON_TITLE = "아름다움의 공통점";
var COMMON_TEXT = "세 사람이 말한 아름다움에는 정해진 정답이 없었다. 갖고 싶어지는 마음, 자꾸 눈길이 머무는 끌림, 규칙과 무규칙 사이에서 터지는 감탄. 표현은 달랐지만 모두 '나를 붙잡아 두는 힘'을 이야기했다. 아름다움은 대상에 고정된 기준이 아니라, 보는 사람의 관점 안에서 오래 머물고 싶어지는 순간에 생긴다.";

/* 스크롤 구간 (단위: vh). 단계 = -1 인트로, 0 지구본, 1~3 인터뷰, 4 공통점 */
var SEG = { introHold:30, morph:110, globe:110, person:110, commonIn:50, common:190 };
var T = {};
T.morph0 = SEG.introHold; T.morph1 = T.morph0 + SEG.morph;
T.globe1 = T.morph1 + SEG.globe;
T.people = PEOPLE.map(function(_,i){ return T.globe1 + SEG.person*i; });
T.common0 = T.globe1 + SEG.person*PEOPLE.length;
T.common1 = T.common0 + SEG.commonIn + SEG.common;
document.documentElement.style.setProperty("--trackH", (T.common1 + 100) + "vh");

/* ================= 요소 ================= */
var $ = function(s){ return document.querySelector(s); };
var stage=$("#stage"), card=$("#card"), cardInner=$("#cardInner"), copy=$("#copy"), place=$("#place"),
    dotsNav=$("#dots"), common=$("#common");

for (var d=0; d<PEOPLE.length+2; d++) dotsNav.appendChild(document.createElement("span"));

common.querySelector("h2").innerHTML = splitWords(COMMON_TITLE);
common.querySelector("p").innerHTML = splitWords(COMMON_TEXT);
function splitWords(s){ return s.split(/(\s+)/).map(function(w){ return /^\s+$/.test(w) ? w : '<span class="w">'+w+'</span>'; }).join(""); }

/* ================= 화면 크기에 따른 기하 ================= */
var G = {};
function measure(){
  var W = innerWidth, H = innerHeight, col = Math.min(W, 480);
  G.W=W; G.H=H;
  G.globeD = Math.min(col - 48, 342, H*0.46);
  G.globeY = H*0.5;
  G.globeZoom = Math.log2(G.globeD*Math.PI/512);
  G.pinY = Math.round(H*0.857);
  /* 카드: 화면 가장자리 16px 안쪽, 디자인 비율(358x812) 유지 */
  var cw = Math.min(col-32, 358*(H-32)/812), ch = cw*812/358;
  G.card = { left:(W-cw)/2, top:(H-ch)/2, width:cw, height:ch, r:24 };
  G.circle = { left:W/2-G.globeD/2, top:G.globeY-G.globeD/2, width:G.globeD, height:G.globeD, r:G.globeD/2 };
  gsap.set(cardInner, { scale: cw/358 });
  var photo = Math.max(150, Math.min(240, G.pinY - 12 - 18 - 16 - 12 - 47 - 1 - 32 - 300));
  place.style.setProperty("--photo", photo+"px");
}
measure();

/* ================= 별 ================= */
var starsCv=$("#stars"), sctx=starsCv.getContext("2d"), STARS=[];
function initStars(){
  var dpr=Math.min(devicePixelRatio||1,2);
  starsCv.width=G.W*dpr; starsCv.height=G.H*dpr; sctx.setTransform(dpr,0,0,dpr,0,0);
  STARS=[]; var n=Math.round(G.W*G.H/2600);
  for (var i=0;i<n;i++) STARS.push({x:Math.random()*G.W, y:Math.random()*G.H, r:Math.random()*1.1+.25, a:Math.random()*.6+.25, tw:Math.random()*6.28, z:Math.random()*.7+.3});
}
initStars();
var starsOn=false, lastT=0;
function drawStars(t){
  var dt = Math.min(50, t-lastT); lastT=t;
  sctx.clearRect(0,0,G.W,G.H);
  for (var i=0;i<STARS.length;i++){ var s=STARS[i];
    s.x += dt*0.006*s.z;               /* 별: 좌 → 우 */
    if (s.x > G.W+2) s.x = -2;
    var a = s.a*(0.75+0.25*Math.sin(t/900+s.tw));
    sctx.globalAlpha=a; sctx.fillStyle="#fff"; sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,6.283); sctx.fill(); }
  sctx.globalAlpha=1;
}

/* ================= 지도 ================= */
var NAME=["coalesce",["get","name:ko"],["get","name"]];
var STYLE={version:8,projection:{type:"globe"},
  sky:{"sky-color":"#ffffff","horizon-color":"#e6e6e9","fog-color":"#ffffff","atmosphere-blend":["interpolate",["linear"],["zoom"],0,.35,5,.35,7,0]},
  glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
  sources:{omt:{type:"vector",url:"https://tiles.openfreemap.org/planet"}},
  layers:[
    {id:"land",type:"background",paint:{"background-color":"#f3f3f5"}},
    {id:"landcover",type:"fill",source:"omt","source-layer":"landcover",paint:{"fill-color":"#ebebee","fill-opacity":.6}},
    {id:"water",type:"fill",source:"omt","source-layer":"water",paint:{"fill-color":"#d9d9de"}},
    {id:"coast",type:"line",source:"omt","source-layer":"water",maxzoom:9,paint:{"line-color":"#8d8d8d","line-opacity":.5,"line-width":["interpolate",["linear"],["zoom"],0,.3,6,.8]}},
    {id:"roads",type:"line",source:"omt","source-layer":"transportation",minzoom:8,paint:{"line-color":"#ffffff","line-width":["interpolate",["exponential",1.6],["zoom"],8,.4,16,5]}},
    {id:"buildings",type:"fill",source:"omt","source-layer":"building",minzoom:13,paint:{"fill-color":"#e2e2e6","fill-outline-color":"#d2d2d7"}},
    {id:"boundary",type:"line",source:"omt","source-layer":"boundary",filter:["all",["<=",["get","admin_level"],2],["!=",["get","maritime"],1]],paint:{"line-color":"#717171","line-opacity":.4,"line-width":.6,"line-dasharray":[2,2]}},
    {id:"country-label",type:"symbol",source:"omt","source-layer":"place",filter:["==",["get","class"],"country"],minzoom:2,maxzoom:7,layout:{"text-field":NAME,"text-font":["Noto Sans Regular"],"text-size":11},paint:{"text-color":"#8d8d8d","text-halo-color":"#f3f3f5","text-halo-width":1}},
    {id:"city-label",type:"symbol",source:"omt","source-layer":"place",filter:["in",["get","class"],["literal",["city","town","suburb","quarter"]]],minzoom:7,layout:{"text-field":NAME,"text-font":["Noto Sans Regular"],"text-size":11},paint:{"text-color":"#8d8d8d","text-halo-color":"#f3f3f5","text-halo-width":1.2}}
  ]};
var GLOBE_CENTER=[124.5,24];
var map = new maplibregl.Map({ container:"map", style:STYLE, center:GLOBE_CENTER, zoom:G.globeZoom,
  interactive:false, attributionControl:{compact:true}, fadeDuration:0 });
var mapReady=false, flying=false;
map.on("load", function(){ mapReady=true; applyStep(step, true); });
function padFor(s){ return s>=1 ? { top: Math.max(0, 2*G.pinY - G.H), bottom:0, left:0, right:0 } : { top:0, bottom:0, left:0, right:0 }; }

/* 지구: 우 → 좌 (경도를 조금씩 올리면 표면이 왼쪽으로 흐른다) */
var spin=true;
function spinGlobe(dt){
  if (!mapReady || flying || step!==0 || !spin) return;
  var c=map.getCenter(); map.jumpTo({ center:[c.lng + dt*0.0022, c.lat] });
}

/* ================= 단계 전환 (인터뷰는 스크롤 위치로 "넘어가는" 방식) ================= */
var step=-2;
function stepAt(vh){
  if (vh < T.morph1 - 10) return -1;
  if (vh < T.globe1) return 0;
  for (var i=PEOPLE.length-1;i>=0;i--) if (vh >= T.people[i]) { if (i===PEOPLE.length-1 && vh >= T.common0) return 4; return i+1; }
  return 0;
}
function setDots(s){
  var spans=dotsNav.children;
  for (var i=0;i<spans.length;i++) spans[i].classList.toggle("on", i===s);
  dotsNav.style.opacity = (s>=0) ? 1 : 0;
}
var flyToken=0;
function applyStep(s, force){
  if (s===step && !force) return;
  var prev=step; step=s;
  setDots(s);
  stage.classList.toggle("dark", s<=0 || s===4);
  stage.classList.toggle("nomap", s===4);
  copy.classList.remove("in"); place.classList.remove("on");
  if (!mapReady) return;

  if (s>=1 && s<=PEOPLE.length){
    var p=PEOPLE[s-1], token=++flyToken;
    renderPerson(p);
    flying=true;
    map.flyTo({ center:p.lnglat, zoom:p.zoom, duration: prev<=0 ? 4200 : 3600, essential:true, padding:padFor(s), minZoom:G.globeZoom });
    map.once("moveend", function(){ if (token!==flyToken) return; flying=false; copy.classList.add("in"); place.classList.add("on"); });
  } else if (s===0){
    var token0=++flyToken;
    if (prev>=1){ flying=true;
      map.flyTo({ center:GLOBE_CENTER, zoom:G.globeZoom, duration:3200, essential:true, padding:padFor(0) });
      map.once("moveend", function(){ if (token0===flyToken) flying=false; });
    } else { flyToken++; flying=false; map.jumpTo({ center:map.getCenter(), zoom:G.globeZoom, padding:padFor(0) }); }
  } else { flyToken++; flying=false; }
}
function renderPerson(p){
  copy.innerHTML = '<div class="role"></div><h2 class="key">'+p.key+'</h2><div class="answer"></div>';
  copy.querySelector(".role").textContent=p.role;
  var a=copy.querySelector(".answer"); p.answer.forEach(function(t){ var el=document.createElement("p"); el.textContent=t; a.appendChild(el); });
  place.querySelector("img").src=p.img; place.querySelector("img").alt=p.place;
  place.querySelector("b").textContent=p.place; place.querySelector("small").textContent=p.region;
  positionPlace();
}
function positionPlace(){ place.style.top = (G.pinY + 9 - place.offsetHeight) + "px"; }

/* ================= 스크롤에 붙는 연속 모션 ================= */
var VH = function(v){ return v; };              /* 타임라인 시간 = vh */
var tl = gsap.timeline({ paused:true, defaults:{ ease:"none" } });

/* ① 인트로 카드 → 원 → 지구본 */
tl.fromTo(card, { left:function(){return G.card.left;}, top:function(){return G.card.top;}, width:function(){return G.card.width;}, height:function(){return G.card.height;}, borderRadius:function(){return G.card.r;} },
  { left:function(){return G.circle.left;}, top:function(){return G.circle.top;}, width:function(){return G.circle.width;}, height:function(){return G.circle.height;},
    borderRadius:function(){return G.circle.r;}, ease:"power2.inOut", duration:SEG.morph*0.78 }, T.morph0);
tl.to(cardInner, { opacity:0, duration:SEG.morph*0.3 }, T.morph0);
tl.to(card, { backgroundColor:"#e4e8ee", duration:SEG.morph*0.4 }, T.morph0 + SEG.morph*0.35);
tl.to("#bgNight", { opacity:1, duration:SEG.morph*0.6 }, T.morph0 + SEG.morph*0.15);
tl.to("#stars", { opacity:1, duration:SEG.morph*0.5 }, T.morph0 + SEG.morph*0.4);
tl.to("#map", { opacity:1, duration:SEG.morph*0.22 }, T.morph0 + SEG.morph*0.74);
tl.to(card, { opacity:0, duration:SEG.morph*0.18 }, T.morph0 + SEG.morph*0.8);
tl.to(["#qGlobe","#hint"], { opacity:1, duration:SEG.morph*0.2 }, T.morph0 + SEG.morph*0.8);

/* ② 지구본 → 첫 인터뷰: 남색 걷히고 밝은 지도 */
tl.to(["#qGlobe","#hint"], { opacity:0, duration:12 }, T.globe1 - 12);
tl.to("#bgNight", { opacity:0, duration:20 }, T.globe1);
tl.to("#stars", { opacity:0, duration:14 }, T.globe1);
tl.to("#mapFade", { opacity:1, duration:20 }, T.globe1);

/* ⑤ 공통점: 밤하늘에서 노을로, 글은 가운데에서 한 단어씩 */
tl.to("#mapFade", { opacity:0, duration:20 }, T.common0);
tl.to("#sky", { opacity:1, duration:SEG.commonIn }, T.common0);
tl.to("#stars", { opacity:1, duration:SEG.commonIn*0.6 }, T.common0);
tl.fromTo("#skyStrip", { yPercent:0 }, { yPercent:-66.66, duration:SEG.commonIn + SEG.common }, T.common0);
tl.to("#stars", { opacity:0, duration:SEG.common*0.35 }, T.common0 + SEG.commonIn + SEG.common*0.2);
tl.to("#skyClouds", { opacity:1, duration:SEG.common*0.5 }, T.common0 + SEG.commonIn + SEG.common*0.3);
var words = common.querySelectorAll(".w");
tl.to(words, { opacity:1, filter:"blur(0px)", y:0, duration:14, stagger:{ amount:SEG.common*0.62 } }, T.common0 + SEG.commonIn*0.6);
tl.set({}, {}, T.common1);

function vhNow(){ return scrollY / innerHeight * 100; }
ScrollTrigger.create({
  trigger:"#track", start:"top top", end:"bottom bottom",
  onUpdate:function(){ var v=vhNow(); tl.time(Math.min(v, T.common1)); applyStep(stepAt(v)); }
});
ScrollTrigger.addEventListener("refresh", function(){ tl.invalidate(); tl.time(Math.min(vhNow(), T.common1)); });

/* 취향 섹션: 검정이 덮어 올라온 뒤 차례로 나타남 */
gsap.utils.toArray("#taste .reveal").forEach(function(el,i){
  gsap.to(el, { opacity:1, y:0, duration:.8, ease:"power3.out", delay:i*.05,
    scrollTrigger:{ trigger:el, start:"top bottom-=24", toggleActions:"play none none reverse" } });
});
$("#moreBtn").addEventListener("click", function(e){ if (this.getAttribute("href")==="#") e.preventDefault(); });

/* ================= 루프 ================= */
function loop(t){
  var dt = Math.min(50, t-(loop.t||t)); loop.t=t;
  var nightVisible = parseFloat(getComputedStyle(starsCv).opacity) > 0.01;
  if (nightVisible) drawStars(t); else lastT=t;
  spinGlobe(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener("resize", function(){
  measure(); initStars(); positionPlace();
  if (mapReady && step===0 && !flying) map.jumpTo({ zoom:G.globeZoom, padding:padFor(0) });
  ScrollTrigger.refresh();
});

tl.time(Math.min(vhNow(), T.common1)); applyStep(stepAt(vhNow()));
})();
</script>
</body>
</html>
