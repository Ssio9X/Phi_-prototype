<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도판함 — 개념 카드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 암실: 배경은 물러나고 카드가 빛난다 */
  --room:       oklch(19% 0.024 285);
  --room-2:     oklch(24.5% 0.028 285);
  --room-line:  oklch(32% 0.028 285);
  --room-ink:   oklch(89% 0.012 285);
  --room-dim:   oklch(60% 0.018 285);

  --card:       oklch(96.5% 0.008 88);
  --card-edge:  oklch(87% 0.012 88);
  --ink:        oklch(24% 0.020 285);
  --ink-soft:   oklch(47% 0.018 285);

  --safe:       oklch(77% 0.145 62);   /* 안전등 */
  --safe-deep:  oklch(62% 0.145 55);
  --stuck:      oklch(66% 0.170 25);

  --intent:     oklch(52% 0.130 250);
  --context:    oklch(58% 0.105 168);

  --mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans: "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --serif:"Noto Serif KR","Apple Myungjo",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--room);color:var(--room-ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
:focus-visible{outline:2px solid var(--safe);outline-offset:3px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- 상단 ---------- */
.top{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.85rem clamp(1rem,4vw,2.5rem);
  border-bottom:1px solid var(--room-line);
  position:sticky;top:0;z-index:20;
  background:color-mix(in oklch,var(--room) 92%,transparent);
  backdrop-filter:blur(10px);
}
.mark{font-family:var(--mono);font-size:.72rem;letter-spacing:.24em;color:var(--safe);margin-right:auto}
.mini{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;
  padding:.4em .75em;border:1px solid var(--room-line);border-radius:2px;color:var(--room-dim);
}
.mini:hover{border-color:var(--safe);color:var(--safe)}

/* ---------- 히어로 = 이 페이지의 할 일 ---------- */
.hero{
  padding:clamp(2.4rem,7vw,4.2rem) clamp(1rem,4vw,2.5rem) clamp(1.6rem,4vw,2.4rem);
  border-bottom:1px solid var(--room-line);
}
.hero-in{max-width:64rem;margin:0 auto;display:flex;align-items:flex-end;gap:2rem;flex-wrap:wrap}
.draw{
  display:flex;align-items:baseline;gap:1rem;
  font-family:var(--serif);font-weight:600;
  font-size:clamp(2rem,6.5vw,3.1rem);line-height:1.15;
  color:var(--room-ink);letter-spacing:-.01em;
  border-bottom:2px solid var(--safe);padding-bottom:.35rem;
  transition:color .18s;
}
.draw:hover{color:var(--safe)}
.draw .arw{font-family:var(--mono);font-size:.42em;color:var(--safe);letter-spacing:0}
.tally{font-family:var(--mono);font-size:.74rem;line-height:1.9;color:var(--room-dim);padding-bottom:.5rem}
.tally b{color:var(--room-ink);font-weight:500}
.tally .st{color:var(--stuck)}

/* ---------- 과목 필터 ---------- */
.subs{
  display:flex;gap:.4rem;flex-wrap:wrap;
  max-width:64rem;margin:0 auto;
  padding:1.1rem clamp(1rem,4vw,2.5rem) 0;
}
.sub{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;
  padding:.4em .8em;border:1px solid var(--room-line);border-radius:999px;color:var(--room-dim);
}
.sub:hover{border-color:var(--room-dim);color:var(--room-ink)}
.sub[aria-pressed="true"]{background:var(--safe);border-color:var(--safe);color:oklch(20% 0.03 62);font-weight:600}

/* ---------- 도판 그리드 ---------- */
.sheet{
  max-width:64rem;margin:0 auto;
  padding:1.3rem clamp(1rem,4vw,2.5rem) 6rem;
  display:grid;gap:1.05rem;
  grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));
}
.plate{
  position:relative;text-align:left;
  background:var(--card);color:var(--ink);
  border-radius:3px;
  min-height:14.5rem;padding:1.05rem 1.1rem 2.4rem;
  display:flex;flex-direction:column;
  /* 종이 여러 장을 쌓은 두께 */
  box-shadow:0 0 0 1px var(--card-edge),
             2px 3px 0 -1px var(--card-edge),
             4px 6px 0 -2px var(--card-edge),
             0 10px 24px oklch(10% 0.02 285 / .45);
  transition:transform .16s ease, box-shadow .16s ease;
}
.plate:hover{
  transform:translate(-2px,-3px);
  box-shadow:0 0 0 1px var(--card-edge),
             3px 5px 0 -1px var(--card-edge),
             6px 9px 0 -2px var(--card-edge),
             0 16px 32px oklch(10% 0.02 285 / .5);
}
.plate .no{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--safe-deep)}
.plate .ttl{
  font-family:var(--serif);font-weight:600;font-size:1.12rem;line-height:1.4;
  margin:.5rem 0 .8rem;
}
.plate .q{font-size:.92rem;line-height:1.6;color:var(--ink-soft);flex:1}
.plate .flipnote{
  position:absolute;left:1.1rem;bottom:1rem;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;color:oklch(63% 0.015 285);
}
.plate .notch{
  position:absolute;top:0;right:0;width:0;height:0;
  border-top:1.5rem solid var(--stuck);border-left:1.5rem solid transparent;
  border-top-right-radius:3px;
}
.add{
  border:1px dashed var(--room-line);border-radius:3px;min-height:14.5rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  color:var(--room-dim);font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;
}
.add:hover{border-color:var(--safe);color:var(--safe)}
.add .plus{font-size:1.6rem;line-height:1}
.empty{
  grid-column:1/-1;padding:3rem 0;text-align:center;
  color:var(--room-dim);font-size:.9rem;
}

/* ---------- 오버레이 ---------- */
.veil{
  position:fixed;inset:0;z-index:40;display:none;
  background:oklch(12% 0.02 285 / .82);backdrop-filter:blur(3px);
  padding:clamp(.8rem,4vw,2.5rem);overflow-y:auto;
}
.veil.on{display:flex;align-items:flex-start;justify-content:center}
.big{
  background:var(--card);color:var(--ink);border-radius:4px;
  width:min(41rem,100%);margin:auto;position:relative;
  box-shadow:0 0 0 1px var(--card-edge),0 24px 60px oklch(8% 0.02 285 / .6);
}
.big .x{
  position:absolute;top:.5rem;right:.7rem;font-family:var(--mono);
  font-size:1.1rem;color:var(--ink-soft);padding:.3rem .5rem;line-height:1;
}
.big .x:hover{color:var(--stuck)}
.face{padding:clamp(1.5rem,4vw,2.4rem)}

.face .no{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--safe-deep)}
.face .ttl{font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.35;margin:.6rem 0 1.2rem}
.face .q{font-size:1.02rem;line-height:1.75}
.recall-hint{
  margin:1.6rem 0 1.4rem;padding:.85rem 1rem;
  background:oklch(93% 0.02 88);border-left:2px solid var(--safe);
  font-size:.86rem;line-height:1.6;color:var(--ink-soft);
}
.big .act{
  display:flex;gap:.5rem;flex-wrap:wrap;
  padding:0 clamp(1.5rem,4vw,2.4rem) clamp(1.5rem,4vw,2.4rem);
}
.act button{
  font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;
  padding:.7em 1.1em;border-radius:2px;border:1px solid var(--card-edge);color:var(--ink-soft);
}
.act button:hover{border-color:var(--ink);color:var(--ink)}
.act .primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.act .primary:hover{background:var(--intent);border-color:var(--intent);color:var(--card)}
.act .got{border-color:var(--context);color:var(--context)}
.act .got:hover{background:var(--context);color:var(--card)}
.act .miss{border-color:var(--stuck);color:var(--stuck)}
.act .miss:hover{background:var(--stuck);color:var(--card)}
.act .sp{flex:1}

.plateimg{margin:0 0 1.4rem}
.plateimg svg{display:block;width:100%;height:auto}
.plateimg figcaption{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;
  color:oklch(58% 0.015 285);margin-top:.5rem;text-align:center;
}
.body{font-size:.98rem;line-height:1.8;white-space:pre-wrap}
.body+.body{margin-top:.9rem}
.memo{
  margin-top:1.5rem;padding-top:1.1rem;border-top:1px solid var(--card-edge);
  font-size:.85rem;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;
}
.memo .lb{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:var(--safe-deep);display:block;margin-bottom:.4rem}
.stat{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:oklch(62% 0.015 285);
  padding:0 clamp(1.5rem,4vw,2.4rem) 1rem;
}

/* ---------- 폼 ---------- */
.form{padding:clamp(1.5rem,4vw,2.4rem)}
.form h2{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin-bottom:1.3rem}
.fld{margin-bottom:1rem}
.fld label{
  display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
  color:var(--safe-deep);margin-bottom:.35rem;
}
.fld .hint{font-family:var(--sans);font-size:.76rem;letter-spacing:0;color:oklch(60% 0.015 285);text-transform:none}
.fld input,.fld textarea,.fld select{
  width:100%;font:inherit;font-size:.94rem;line-height:1.65;
  padding:.6em .7em;border:1px solid var(--card-edge);border-radius:2px;
  background:oklch(99% 0.004 88);color:var(--ink);
}
.fld textarea{resize:vertical;min-height:5.5rem}
.fld input:focus,.fld textarea:focus{border-color:var(--intent);outline:none;box-shadow:0 0 0 2px oklch(52% 0.13 250 /.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}

.toast{
  position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(1.5rem);
  background:var(--room-2);border:1px solid var(--room-line);color:var(--room-ink);
  font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;
  padding:.7em 1.1em;border-radius:2px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:60;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.foot{
  max-width:64rem;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem) 3rem;
  font-size:.78rem;line-height:1.7;color:var(--room-dim);
}
.foot code{font-family:var(--mono);font-size:.92em;color:var(--safe)}

@media (max-width:560px){
  .plateimg{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .plateimg svg{min-width:29rem}
  .draw{font-size:2rem}
  .row2{grid-template-columns:1fr}
  .hero-in{gap:1.1rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .plate:hover{transform:none}
}
</style>
</head>
<body>

<div class="top">
  <span class="mark">도판함 · PLATE BOX</span>
  <button class="mini" id="bAdd">+ 카드</button>
  <button class="mini" id="bOut">내보내기</button>
  <button class="mini" id="bIn">불러오기</button>
  <input type="file" id="fIn" accept="application/json" hidden>
</div>

<section class="hero">
  <div class="hero-in">
    <button class="draw" id="bDraw">떠올리기 <span class="arw">▸ 무작위 한 장</span></button>
    <div class="tally" id="tally"></div>
  </div>
</section>

<div class="subs" id="subs"></div>
<div class="sheet" id="sheet"></div>

<div class="foot">
  앞면에는 질문만 있습니다. 답을 소리 내어 떠올린 다음 뒤집으세요. 막힌 카드는 모서리에 표시가 남고 <b>떠올리기</b>에서 먼저 나옵니다.<br>
  기록은 이 브라우저에 저장됩니다. 파일을 <b>다운로드해서 열어야</b> 저장이 유지되고, <code>내보내기</code>로 백업해 두면 기기를 옮겨도 이어집니다.
</div>

<!-- 카드 보기 -->
<div class="veil" id="vCard">
  <div class="big">
    <button class="x" data-close>✕</button>
    <div class="face" id="cFace"></div>
    <div class="act" id="cAct"></div>
    <div class="stat" id="cStat"></div>
  </div>
</div>

<!-- 카드 추가/수정 -->
<div class="veil" id="vForm">
  <div class="big">
    <button class="x" data-close>✕</button>
    <div class="form">
      <h2 id="fTitle">카드 추가</h2>
      <div class="row2">
        <div class="fld">
          <label for="iSub">수업</label>
          <input id="iSub" list="subList" placeholder="VT" autocomplete="off">
          <datalist id="subList"></datalist>
        </div>
        <div class="fld">
          <label for="iCode">번호</label>
          <input id="iCode" placeholder="VT-02" autocomplete="off">
        </div>
      </div>
      <div class="fld">
        <label for="iTtl">개념 이름</label>
        <input id="iTtl" placeholder="의도와 맥락" autocomplete="off">
      </div>
      <div class="fld">
        <label for="iQ">앞면 · 질문 <span class="hint">— 답이 들어가면 안 됩니다</span></label>
        <textarea id="iQ" placeholder="이 개념을 다시 꺼내게 만드는 질문"></textarea>
      </div>
      <div class="fld">
        <label for="iA">뒷면 · 내 정리 <span class="hint">— 내 말로 쓴 것만</span></label>
        <textarea id="iA" rows="7"></textarea>
      </div>
      <div class="fld">
        <label for="iM">어디서 걸렸나 <span class="hint">— 비워도 됩니다</span></label>
        <textarea id="iM" rows="3" placeholder="이 개념을 만난 자리, 아직 안 풀린 것"></textarea>
      </div>
      <div class="act" style="padding:0">
        <button class="primary" id="bSave">저장</button>
        <button id="bDel" style="display:none" class="miss">삭제</button>
        <span class="sp"></span>
        <button data-close>취소</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var KEY='plateBox_v1';

/* ============ 첫 카드 ============ */
var SEED=[{
  id:'vt01', sub:'VT', code:'VT-01', title:'의도와 맥락',
  q:'의도와 맥락은 둘 중 하나를 고르는 문제인가? 둘의 관계를 그림으로 그려 설명해 보라.',
  a:'의도는 행위 자체가 작가의 선택으로 이루어지고 대상자는 의도를 행위(그래픽, 이미지 등)로 전달받는다. 작가가 의도한 것을 받는 대상자는 맥락 안에서 이해하게 되는데, 맥락은 의도를 주된 근간으로 품고 있기 때문이다.\n\n그렇기에 의도 자체가 기반이 되고 그 위에 맥락이 받쳐 주어야 하는 보완적 존재로 구성된다. 또한 맥락은 치밀한 구성으로 완성되어야지 의도가 전달된다.\n\n청자와 시점과 장소를 지정하는 행위 자체가 작가의 선택이다. 맥락을 설정하는 것은 의도를 내려놓는 일이 아니라 의도를 한 번 더 행사하는 일이다. 그래서 둘은 층위가 다르다. 의도는 무엇을 말할지를 정하고, 맥락은 그것이 어떻게 받아들여지는지에 대한 수단이다.',
  m: 'VT 사전 과제 ①번 항목(누가·언제·어디서)을 두고 나눈 대화에서 나왔다.\n\n아직 안 푼 것 — 대상자를 "받기만 하는 쪽"으로 두면 내가 앞서 쓴 "서로가 알 수 있는 이미지"와 어긋난다. 다음에 이어서.',
  svg:'PLATE_VT01',
  cap:'',
  st:{seen:0,got:0,miss:0,last:0,stuck:false}
}];

/* ============ 도판 ============ */
var PLATES={};
PLATES.PLATE_VT01 = [
'<svg viewBox="0 52 632 338" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="의도·맥락·행위 층위와 맥락 밀도 비교">',
'<defs>',
'<pattern id="sparse" width="30" height="10" patternUnits="userSpaceOnUse">',
'<line x1="0" y1="0" x2="0" y2="10" stroke="oklch(58% 0.105 168)" stroke-width="1.6"/></pattern>',
'<pattern id="dense" width="7" height="10" patternUnits="userSpaceOnUse">',
'<line x1="0" y1="0" x2="0" y2="10" stroke="oklch(58% 0.105 168)" stroke-width="1.6"/></pattern>',
'<marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7">',
'<path d="M0 0L5 10L10 0z" fill="oklch(62% 0.145 55)"/></marker>',
'</defs>',
// 층 이름 (공통 축)
'<g font-family="ui-monospace,monospace" text-anchor="end" fill="oklch(24% 0.02 285)">',
'<text x="118" y="176" font-size="14" font-weight="700">행위</text>',
'<text x="118" y="222" font-size="14" font-weight="700">맥락</text>',
'<text x="118" y="268" font-size="14" font-weight="700">의도</text>',
'</g>',
'<g font-family="sans-serif" text-anchor="end" fill="oklch(47% 0.018 285)" font-size="10.5">',
'<text x="118" y="191">그래픽 · 이미지</text>',
'<text x="118" y="237">누가 · 언제 · 어디서</text>',
'<text x="118" y="283">무엇을 말할지</text>',
'</g>',
'<text x="118" y="300" text-anchor="end" font-family="sans-serif" font-size="9.5" fill="oklch(62% 0.145 55)">작가가 놓는 층</text>',
// ---- A: 성긴 맥락 ----
'<g>',
'<rect x="140" y="150" width="220" height="46" fill="oklch(94% 0.012 88)" stroke="oklch(24% 0.02 285)" stroke-width="1.4"/>',
'<rect x="140" y="196" width="220" height="46" fill="url(#sparse)" stroke="oklch(24% 0.02 285)" stroke-width="1.4"/>',
'<rect x="140" y="242" width="220" height="46" fill="oklch(52% 0.13 250)" stroke="oklch(24% 0.02 285)" stroke-width="1.4"/>',
'<text x="250" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="oklch(47% 0.018 285)">대상자</text>',
'<circle cx="250" cy="95" r="7" fill="none" stroke="oklch(47% 0.018 285)" stroke-width="1.6"/>',
'<line x1="250" y1="108" x2="250" y2="205" stroke="oklch(62% 0.145 55)" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#dn)"/>',
'<g stroke="oklch(66% 0.17 25)" stroke-width="2.8" stroke-linecap="round">',
'<line x1="241" y1="222" x2="259" y2="240"/><line x1="259" y1="222" x2="241" y2="240"/></g>',
'<text x="250" y="318" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="oklch(24% 0.02 285)">성긴 맥락</text>',
'<text x="250" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="oklch(66% 0.17 25)">의도까지 닿지 못한다</text>',
'</g>',
// ---- B: 치밀한 맥락 ----
'<g>',

/* ============ 상태 ============ */
var cards=[], filter='전체', cur=null, editing=null;

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    cards = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED));
  }catch(e){ cards=JSON.parse(JSON.stringify(SEED)); }
  if(!Array.isArray(cards)||!cards.length) cards=JSON.parse(JSON.stringify(SEED));
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(cards)); }
  catch(e){ toast('저장 실패 — 파일을 다운로드해서 열어야 저장됩니다'); }
}
function toast(t){
  var el=document.getElementById('toast');
  el.textContent=t; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('on');},2400);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ============ 그리기 ============ */
function subjects(){
  var out=[]; cards.forEach(function(c){ if(out.indexOf(c.sub)<0) out.push(c.sub); });
  return out.sort();
}
function shown(){
  return filter==='전체' ? cards : cards.filter(function(c){return c.sub===filter;});
}
function drawSubs(){
  var box=document.getElementById('subs'), list=['전체'].concat(subjects());
  box.innerHTML='';
  list.forEach(function(s){
    var b=document.createElement('button');
    b.className='sub'; b.textContent=s;
    b.setAttribute('aria-pressed', s===filter);
    b.onclick=function(){ filter=s; drawSubs(); drawSheet(); };
    box.appendChild(b);
  });
  var dl=document.getElementById('subList');
  dl.innerHTML=''; subjects().forEach(function(s){
    var o=document.createElement('option'); o.value=s; dl.appendChild(o);
  });
}
function drawTally(){
  var all=cards.length, st=cards.filter(function(c){return c.st&&c.st.stuck;}).length;
  var fresh=cards.filter(function(c){return !c.st||!c.st.seen;}).length;
  document.getElementById('tally').innerHTML=
    '모은 카드 <b>'+all+'</b>장'
    +'<br>아직 안 꺼낸 것 <b>'+fresh+'</b>장'
    +(st?'<br><span class="st">막힌 것 '+st+'장</span>':'');
}
function drawSheet(){
  var box=document.getElementById('sheet'), list=shown();
  box.innerHTML='';
  list.forEach(function(c){
    var b=document.createElement('button');
    b.className='plate';
    b.innerHTML=(c.st&&c.st.stuck?'<span class="notch"></span>':'')
      +'<span class="no">'+esc(c.code||c.sub)+'</span>'
      +'<span class="ttl">'+esc(c.title)+'</span>'
      +'<span class="q">'+esc(c.q)+'</span>'
      +'<span class="flipnote">떠올린 뒤 → 뒤집기</span>';
    b.onclick=function(){ open(c); };
    box.appendChild(b);
  });
  var add=document.createElement('button');
  add.className='add';
  add.innerHTML='<span class="plus">+</span><span>카드 추가</span>';
  add.onclick=function(){ openForm(null); };
  box.appendChild(add);
  if(!list.length){
    var e=document.createElement('p');
    e.className='empty'; e.textContent=filter+' 카드는 아직 없습니다.';
    box.insertBefore(e,add);
  }
  drawTally();
}

/* ============ 카드 열기 ============ */
function open(c,flipped){
  cur=c;
  var face=document.getElementById('cFace'),
      act=document.getElementById('cAct'),
      stat=document.getElementById('cStat');

  if(!flipped){
    face.innerHTML='<span class="no">'+esc(c.code||c.sub)+'</span>'
      +'<h2 class="ttl">'+esc(c.title)+'</h2>'
      +'<p class="q">'+esc(c.q)+'</p>'
      +'<div class="recall-hint">보지 않고 먼저 말해 보세요. 떠오르지 않는 부분이 어디인지까지 확인한 다음 뒤집습니다.</div>';
    act.innerHTML='<button class="primary" id="aFlip">뒤집기</button>'
      +'<span class="sp"></span><button id="aEdit">고치기</button>';
    document.getElementById('aFlip').onclick=function(){ open(c,true); };
    document.getElementById('aEdit').onclick=function(){ close('vCard'); openForm(c); };
    stat.textContent='';
  }else{
    var img = c.svg && PLATES[c.svg]
      ? '<figure class="plateimg">'+PLATES[c.svg]
        +(c.cap?'<figcaption>'+esc(c.cap)+'</figcaption>':'')+'</figure>' : '';
    var body = String(c.a||'').split(/\n\n+/).map(function(p){
      return '<p class="body">'+esc(p)+'</p>'; }).join('');
    face.innerHTML='<span class="no">'+esc(c.code||c.sub)+'</span>'
      +'<h2 class="ttl">'+esc(c.title)+'</h2>'
      +img+body
      +(c.m?'<div class="memo"><span class="lb">어디서 걸렸나</span>'+esc(c.m)+'</div>':'');
    act.innerHTML='<button class="got" id="aGot">떠올랐다</button>'
      +'<button class="miss" id="aMiss">막혔다</button>'
      +'<span class="sp"></span><button id="aEdit2">고치기</button>';
    document.getElementById('aGot').onclick=function(){ mark(c,true); };
    document.getElementById('aMiss').onclick=function(){ mark(c,false); };
    document.getElementById('aEdit2').onclick=function(){ close('vCard'); openForm(c); };
    var s=c.st||{};
    stat.textContent = s.seen ? ('꺼낸 횟수 '+s.seen+' · 떠오름 '+(s.got||0)+' · 막힘 '+(s.miss||0)) : '처음 꺼낸 카드';
  }
  show('vCard');
}
function mark(c,ok){
  c.st=c.st||{seen:0,got:0,miss:0,last:0,stuck:false};
  c.st.seen++; c.st.last=Date.now();
  if(ok){ c.st.got++; c.st.stuck=false; } else { c.st.miss++; c.st.stuck=true; }
  save(); drawSheet(); close('vCard');
  toast(ok?'떠올랐다로 기록':'막혔다로 기록 — 다음에 먼저 나옵니다');
}

/* ============ 무작위 뽑기 ============ */
document.getElementById('bDraw').onclick=function(){
  var pool=shown();
  if(!pool.length){ toast('뽑을 카드가 없습니다'); return; }
  var stuck=pool.filter(function(c){return c.st&&c.st.stuck;});
  var fresh=pool.filter(function(c){return !c.st||!c.st.seen;});
  var pick = stuck.length ? stuck : (fresh.length ? fresh : pool);
  var c=pick[Math.floor(Math.random()*pick.length)];
  if(pick.length>1 && c===cur) c=pick[(pick.indexOf(c)+1)%pick.length];
  open(c,false);
};

/* ============ 폼 ============ */
function openForm(c){
  editing=c; autoCode=!c;
  document.getElementById('fTitle').textContent = c?'카드 고치기':'카드 추가';
  document.getElementById('iSub').value  = c?c.sub  : (filter==='전체'?'VT':filter);
  document.getElementById('iCode').value = c?(c.code||'') : nextCode(filter==='전체'?'VT':filter);
  document.getElementById('iTtl').value  = c?c.title: '';
  document.getElementById('iQ').value    = c?c.q    : '';
  document.getElementById('iA').value    = c?c.a    : '';
  document.getElementById('iM').value    = c?(c.m||''): '';
  document.getElementById('bDel').style.display = c?'':'none';
  show('vForm');
  setTimeout(function(){document.getElementById('iTtl').focus();},50);
}
var autoCode=true;
document.getElementById('iCode').addEventListener('input',function(){ autoCode=false; });
document.getElementById('iSub').addEventListener('input',function(){
  if(!editing && autoCode){
    document.getElementById('iCode').value = nextCode(this.value.trim()||'기타');
  }
});
function nextCode(sub){
  var n=cards.filter(function(c){return c.sub===sub;}).length+1;
  return sub+'-'+String(n).padStart(2,'0');
}
document.getElementById('bSave').onclick=function(){
  var sub=document.getElementById('iSub').value.trim()||'기타',
      ttl=document.getElementById('iTtl').value.trim(),
      q  =document.getElementById('iQ').value.trim(),
      a  =document.getElementById('iA').value.trim();
  if(!ttl||!q||!a){ toast('개념 이름 · 질문 · 내 정리는 채워야 합니다'); return; }
  if(editing){
    editing.sub=sub; editing.code=document.getElementById('iCode').value.trim();
    editing.title=ttl; editing.q=q; editing.a=a;
    editing.m=document.getElementById('iM').value.trim();
  }else{
    cards.push({
      id:'c'+Date.now(), sub:sub,
      code:document.getElementById('iCode').value.trim()||nextCode(sub),
      title:ttl, q:q, a:a, m:document.getElementById('iM').value.trim(),
      st:{seen:0,got:0,miss:0,last:0,stuck:false}
    });
  }
  save(); drawSubs(); drawSheet(); close('vForm');
  toast(editing?'고쳤습니다':'카드를 넣었습니다');
};
document.getElementById('bDel').onclick=function(){
  if(!editing) return;
  if(!confirm('"'+editing.title+'" 카드를 지웁니다. 되돌릴 수 없습니다.')) return;
  cards=cards.filter(function(c){return c!==editing;});
  save(); drawSubs(); drawSheet(); close('vForm'); toast('지웠습니다');
};

/* ============ 내보내기 / 불러오기 ============ */
document.getElementById('bOut').onclick=function(){
  var blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='도판함-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('카드 '+cards.length+'장을 내보냈습니다');
};
document.getElementById('bIn').onclick=function(){ document.getElementById('fIn').click(); };
document.getElementById('fIn').onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var got=JSON.parse(r.result);
      if(!Array.isArray(got)) throw 0;
      var have={}; cards.forEach(function(c){have[c.id]=1;});
      var added=0;
      got.forEach(function(c){ if(c&&c.title&&!have[c.id]){ cards.push(c); added++; } });
      save(); drawSubs(); drawSheet();
      toast(added?('카드 '+added+'장을 더했습니다'):'새로 더할 카드가 없습니다');
    }catch(err){ toast('읽을 수 없는 파일입니다'); }
    e.target.value='';
  };
  r.readAsText(f);
};
document.getElementById('bAdd').onclick=function(){ openForm(null); };

/* ============ 오버레이 ============ */
function show(id){ document.getElementById(id).classList.add('on'); document.body.style.overflow='hidden'; }
function close(id){ document.getElementById(id).classList.remove('on'); document.body.style.overflow=''; }
document.querySelectorAll('[data-close]').forEach(function(b){
  b.onclick=function(){ close(b.closest('.veil').id); };
});
document.querySelectorAll('.veil').forEach(function(v){
  v.onclick=function(e){ if(e.target===v) close(v.id); };
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ document.querySelectorAll('.veil.on').forEach(function(v){close(v.id);}); }
});

load(); drawSubs(); drawSheet();
})();
</script>
